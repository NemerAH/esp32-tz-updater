name: Update Timezone DB

on:
  # Trigger on push to any branch (for initial testing)
  # We'll change this to scheduled later
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository
      # This gives the workflow access to your repo files
      - name: Checkout repository
        uses: actions/checkout@v3
      
      # Step 2: Set up Python
      # Installs Python so we can run our script
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # Step 3: Run the conversion script
      # This generates tz.json and tz_version.json in public/
      - name: Run timezone conversion script
        run: python scripts/convert.py
      
      # Step 4: Commit and push generated files back to repo
      # This is the critical step — without it, files are lost
      - name: Commit generated TZ files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/*
          git commit -m "Update TZ data [skip ci]" || echo "No changes to commit"
          git push
