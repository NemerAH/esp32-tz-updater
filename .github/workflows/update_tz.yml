name: Update Timezones Daily

on:
  schedule:
    - cron: '40 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Timezone Data
        run: python scripts/convert.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add all three files!
          git add public/tz.json public/tzme.json public/tz_version.json

          if git diff --staged --quiet; then
            echo "No changes in timezone data."
          else
            git commit -m "🤖 Auto-update: Timezone database changed"
            git push
        fi
